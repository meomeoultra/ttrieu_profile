<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pro5</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
margin:0;
min-height:100vh;
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
background-size: 300% 300%;
animation: bgMove 12s ease infinite;
color:white;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(0,150,255,0.2), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(0,255,200,0.15), transparent 40%);
animation: lightFloat 15s linear infinite;
pointer-events:none;
}

@keyframes lightFloat{
0%{transform:translateX(0);}
50%{transform:translateX(-50px);}
100%{transform:translateX(0);}
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html{
scroll-behavior:smooth;
}
	

/* ===== LOADER ===== */
#loader{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
color:gold;
font-size:22px;
letter-spacing:3px;
animation:fadeOut 1s ease forwards;
animation-delay:3s;
}

#loader span{
font-size:40px;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{opacity:1;transform:scale(1);}
50%{opacity:0.5;transform:scale(1.1);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ===== COUPLE HEAD BALANCE ===== */

.top-bar{
    position: fixed;
    top: 30px;
    left: 0;
    width: 100%;
    padding: 0 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 9999;
}

.countdown-box,
.name-wrapper{
    max-width: 45%;
}

.glass{
    padding: 10px 20px;
    border-radius: 50px;
}

.countdown-box.shrink,
.name-wrapper.shrink{
transform:scale(0.85);
}

.glass{
padding:12px 28px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border-radius:50px;
border:1px solid rgba(255,215,0,0.4);
box-shadow:0 0 20px rgba(255,215,0,0.3);
color:gold;
font-weight:bold;
white-space:nowrap;
display:inline-flex;
align-items:center;
gap:8px;
}


.horse-run{
position:absolute;
top:-22px;
right:20px;
font-size:22px;
animation:runHorse 6s linear infinite;
}

@keyframes runHorse{
0%{ transform:translateX(0) scaleX(1); }
49%{ transform:translateX(-170px) scaleX(1); }
50%{ transform:translateX(-170px) scaleX(-1); }
100%{ transform:translateX(0) scaleX(-1); }
}

.red-mode{
filter:hue-rotate(-60deg) saturate(300%);
text-shadow:0 0 20px red,0 0 40px red;
}

/* ===== HERO ===== */

.hero{
    height:65vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.hero h1{
    font-size:60px;
    font-weight:900;
    letter-spacing:4px;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff7300,
        #fffb00,
        #48ff00,
        #00ffd5,
        #002bff,
        #7a00ff,
        #ff00c8,
        #ff0000
    );

    background-size:400%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
    rainbowFlow 10s linear infinite;

}

@keyframes rainbowFlow{
    0%{ background-position:0% }
    100%{ background-position:400% }
}

@keyframes ledGlow{
    from{
        filter: drop-shadow(0 0 10px #ff00ff)
                drop-shadow(0 0 20px #00ffff);
    }
    to{
        filter: drop-shadow(0 0 20px #ffffff)
                drop-shadow(0 0 40px #ff00ff)
                drop-shadow(0 0 60px #00ffff);
    }
}

.hero h1::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:50%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
    );
    animation: shine 3s infinite;
    pointer-events:none;
}

.hero h1{
    position:relative;
    overflow:hidden;   /* QUAN TRỌNG */
}

.hero h1{
    text-align:center;
    width:100%;
}


@keyframes shine{
    0%{ left:-100%; }
    100%{ left:100%; }
}
	
.hero p{
margin-top:10px;
opacity:0.8;
}

/* ===== SERVICES ===== */

.services{
margin-top:0;
padding:0 8%;
text-align:center;
}

.services-title{
font-size:38px;
margin-bottom:60px;
background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet);
background-size:400%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:ledTitle 6s linear infinite;
}

@keyframes ledTitle{
0%{background-position:0%}
100%{background-position:400%}
}

.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:35px;
}

.service-card{
position:relative;
padding:40px 25px;
border-radius:25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
transition:0.4s;
overflow:hidden;
}

.service-card:hover{
transform:translateY(-15px) scale(1.03);
box-shadow:0 0 30px rgba(255,215,0,0.6);
}

.service-card::before{
content:"";
position:absolute;
inset:0;
border-radius:25px;
padding:2px;
background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet);
background-size:400%;
animation: ledBorder 4s linear infinite;
-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite: xor;
mask-composite: exclude;
}

@keyframes ledBorder{
0%{background-position:0%}
100%{background-position:400%}
}

.service-icon{
font-size:45px;
margin-bottom:20px;
color:gold;
text-shadow:0 0 15px gold;
}

.service-card h3{
margin-bottom:15px;
color:gold;
}

.service-card p{
opacity:0.85;
}

/* ===== CONTACT ===== */

.contact{
margin-top:120px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
padding-bottom:100px;
}

.contact a{
display:flex;
justify-content:center;
align-items:center;
width:65px;
height:65px;
border-radius:50%;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,215,0,0.5);
color:gold;
font-size:22px;
text-decoration:none;
transition:0.4s ease;
position:relative;
overflow:hidden;
}

.contact a::before{
content:"";
position:absolute;
inset:-3px;
border-radius:50%;
background:linear-gradient(45deg,gold,orange,yellow);
opacity:0;
transition:0.4s;
z-index:-1;
}

.contact a:hover::before{
opacity:1;
filter:blur(10px);
}

.contact a:hover{
box-shadow:0 0 20px gold;
transform:scale(1.1);
}

.contact a:nth-child(1):hover{
color:#1877f2;
box-shadow:0 0 20px #1877f2;
}

.contact a:nth-child(2):hover{
color:#e1306c;
box-shadow:0 0 20px #e1306c;
}

.contact a:nth-child(3):hover{
color:#ffffff;
box-shadow:0 0 20px #ffffff;
}

.contact a:nth-child(4):hover{
color:#ffcc00;
box-shadow:0 0 20px #ffcc00;
}

.contact a:hover{
transform:translateY(-8px) scale(1.15);
}

/* ===== FIREWORK ===== */
.firework{
position:fixed;
width:6px;
height:6px;
background:gold;
border-radius:50%;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
to{
transform:translate(var(--x),var(--y));
opacity:0;
}
}

@media(max-width:768px){
.hero h1{ font-size:40px; }
.services{ padding:0 5%; }
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}


@keyframes stageLight{
from{transform:translateX(-100%);}
to{transform:translateX(100%);}
}

.footer{
text-align:center;
padding:20px 0 40px;
font-size:14px;
opacity:0.6;
color:gold;
letter-spacing:1px;
}

.music-player{
display:none !important;
}

.music-player.minimized{
transform:scale(0.6);
opacity:0.6;
}

.player-header{
padding:10px;
background:gold;
color:black;
cursor:pointer;
font-weight:bold;
text-align:center;
cursor:grab;
touch-action:none;
}


.player-body{
padding:15px;
}

.visualizer{
animation:pulseCircle 1s infinite;
}


@keyframes pulseCircle{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

.controls{
display:flex;
justify-content:center;
gap:15px;
margin:10px 0;
}

.controls button{
padding:6px 12px;
border:none;
border-radius:8px;
background:gold;
cursor:pointer;
}

.time{
text-align:center;
margin:5px 0;
}

#progress, #volume{
width:100%;
margin:5px 0;
}

.collapsed .player-body{
display:none;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}

.btn-valentine {
    display: inline-block;
    padding: 12px 25px;
    background: linear-gradient(45deg, #ff4e50, #fc913a);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    transition: 0.3s;
}

.btn-valentine:hover {
    transform: scale(1.1);
}
.btn {
    display: inline-block;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    text-decoration: none;
    border-radius: 40px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
    box-shadow: 0 0 15px rgba(255, 81, 47, 0.6);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

/* Hover nâng lên + sáng hơn */
.btn:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px rgba(255, 81, 47, 0.9);
}

/* Hiệu ứng ánh sáng chạy ngang */
.btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
    );
    transition: 0.5s;
}

.btn:hover::before {
    left: 100%;
}

/* ===== BUTTON GROUP LUXURY VERSION ===== */

.btn-group{
    margin-top:140px;      /* tạo khoảng cách dưới 2 box */
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    flex-wrap:wrap;
    padding:20px;
}

.btn-group a{
    min-width:240px;
    padding:14px 26px;
    border-radius:14px;
    font-weight:600;
    text-decoration:none;
    text-align:center;
    transition:all 0.3s ease;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
}

/* nút tết */
.btn{
    background:linear-gradient(135deg,#ffb347,#ffcc33);
    color:#111;
}

/* nút valentine */
.btn-valentine{
    background:linear-gradient(135deg,#ff4e9b,#ff0066);
    color:#fff;
}

/* nút diem */
.btn-diem{
    background:linear-gradient(135deg,#ff4e9b,#ff0066);
    color:#4169E1;
}

/* hover effect */
.btn-group a:hover{
    transform:translateY(-4px) scale(1.05);
}

/* mobile tối ưu */
@media(max-width:600px){
    .btn-group{
        gap:20px;
        margin-top:120px;
    }
}

.love-text{
    font-size:15px;
    font-weight:bold;
    background:linear-gradient(45deg,#ff4e9b,#ff0066,#ff4e9b);
    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:loveGlow 2s ease infinite alternate,
              loveMove 4s linear infinite;
    text-shadow:
        0 0 10px rgba(255,0,102,0.7),
        0 0 20px rgba(255,0,102,0.6),
        0 0 40px rgba(255,0,102,0.4);
    letter-spacing:2px;
}

@keyframes loveGlow{
    from{
        text-shadow:
        0 0 10px #ff0066,
        0 0 20px #ff4e9b;
    }
    to{
        text-shadow:
        0 0 20px #ff0066,
        0 0 40px #ff4e9b,
        0 0 60px #ff0066;
    }
}

@keyframes loveMove{
    0%{background-position:0%}
    100%{background-position:200%}
}

.love-container{
    position: relative;
    display: inline-block;
}

.floating-heart{
    position: absolute;
    font-size: 18px;
    pointer-events: none;
    animation: flyHeart 2.5s ease-out forwards;
}

@keyframes flyHeart{
    0%{
        opacity: 0;
        transform: translate(0,0) scale(0.8);
    }
    20%{
        opacity: 1;
    }
    100%{
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1.2);
    }
}

</style>
</head>
<body>

<div id="loader">
<span>👑</span>
Cảm Ơn Vi Da Den...
</div>

<div class="top-bar">
    <div class="name-wrapper glass" id="nameWrapper">
        👑 TTRIEU • MEO MEO 🐱
        <div class="horse-run" id="horse">🐎</div>
    </div>
</div>

<section class="hero">
<h1 id="heroTitle">Le Tran Tan Trieu ✓</h1>
<p>?</p>
</section>
<section class="services">
<h2 class="services-title">Tiện ích:</h2>

<div class="services-grid">

<div class="service-card">
<i class="fa-solid fa-heart service-icon"></i>
<h3>Open Valentine</h3>
<p>Mở trang Valentine.(codeib)</p>
<br>
<a href="/hoa" class="btn btn-valentine">
Open
</a>
</div>

<div class="service-card">
<i class="fa-solid fa-calculator service-icon"></i>
<h3>Tính điểm</h3>
<p>Công cụ tính điểm tốt nghiệp.</p>
<br>
<a href="/diem" class="btn">
Open
</a>
</div>

<div class="service-card">
<i class="fa-solid fa-laptop-code service-icon"></i>
<h3>!@#$%^&*()</h3>
<p>Coming Soon...</p>
</div>

<div class="service-card">
<i class="fa-solid fa-bolt service-icon"></i>
<h3>!@#$%^&*()</h3>
<p>Coming Soon...</p>
</div>

</div>
</section>

<section class="contact">
<a href="https://www.facebook.com/share/1SfE8dUVnu/" target="_blank"rel="noopener noreferrer">
    <i class="fa-brands fa-facebook"></i>
</a>
<a href="#"><i class="fa-brands fa-instagram"></i></a>
<a href="#"><i class="fa-brands fa-github"></i></a>
<a href="#"><i class="fa-solid fa-envelope"></i></a>
</section>
<footer class="footer">
© 2026 TTRIEU. Yahhhh.
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

    /* ========= DOM CACHE ========= */
    const nameWrapper = document.getElementById("nameWrapper");
    const heroTitle = document.getElementById("heroTitle");

    /* ========= SCROLL SHRINK ========= */
    window.addEventListener("scroll", () => {
        const shrink = window.scrollY > 50;
        nameWrapper.classList.toggle("shrink", shrink);
        heroTitle.classList.toggle("shrink", shrink);
    });

    /* ========= PETAL SYSTEM (TỐI ƯU) ========= */
    function createPetal(){
        const petal = document.createElement("div");
        petal.textContent = "🌸";

        petal.style.position = "fixed";
        petal.style.top = "-20px";
        petal.style.left = Math.random()*window.innerWidth + "px";
        petal.style.fontSize = (Math.random()*15 + 15) + "px";
        petal.style.animation = `fall ${Math.random()*4+6}s linear`;
        petal.style.pointerEvents = "none";
        petal.style.zIndex = "1";

        document.body.appendChild(petal);
        setTimeout(()=>petal.remove(),9000);
    }

    setTimeout(()=>{
        setInterval(createPetal, 1200);
    },2000);

    /* ========= AUTO FIT TEXT ========= */
    function autoFitText() {
        const text = document.getElementById("windowText");
        const parent = document.getElementById("window");

        if (!text || !parent) return;

        let fontSize = 22;
        text.style.fontSize = fontSize + "px";

        while (text.scrollWidth > parent.clientWidth - 20 && fontSize > 10) {
            fontSize--;
            text.style.fontSize = fontSize + "px";
        }
    }

    autoFitText();
    window.addEventListener("resize", autoFitText);

});
</script>

</body>
