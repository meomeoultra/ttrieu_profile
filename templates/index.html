
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pro5</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --bg:#0b1120;
    --bg2:#111827;
    --card:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.08);
    --text:#f3f4f6;
    --muted:#9ca3af;
    --accent:#3b82f6;
    --gold:#facc15;
    --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left, rgba(59,130,246,.15), transparent 30%),
    radial-gradient(circle at bottom right, rgba(250,204,21,.08), transparent 30%),
    linear-gradient(135deg,var(--bg),#0f172a,var(--bg2));
    color:var(--text);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.01);
    pointer-events:none;
}

/* ===== LOADER ===== */
#loader{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99999;
    color:var(--gold);
    gap:12px;
    letter-spacing:2px;
    animation:fadeOut 1s ease forwards;
    animation-delay:2.5s;
}

#loader span{
    font-size:42px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.08);opacity:.65;}
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* ===== TOP BAR ===== */
.top-bar{
    width:100%;
    display:flex;
    justify-content:center;
    padding:24px 20px 0;
    position:relative;
    z-index:20;
}

.glass{
    padding:12px 22px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(8px);
    box-shadow:0 6px 18px rgba(0,0,0,.22);
    color:var(--gold);
    font-weight:700;
    letter-spacing:.5px;
}

.name-wrapper{
    transition:.3s ease;
}

.name-wrapper.shrink{
    transform:scale(.92);
}

.horse-run{
    display:none;
}

/* ===== HERO ===== */
.hero{
    min-height:55vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px 20px;
}

.hero h1{
    font-size:clamp(40px,8vw,68px);
    font-weight:900;
    line-height:1.1;
    margin-bottom:16px;
    background:linear-gradient(90deg,#fff,#cbd5e1,#60a5fa);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    position:relative;
}

.hero h1::after{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width:18%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );
    transform:skewX(-20deg);
    will-change:transform;
    animation:shine 5s linear infinite;
}

@keyframes shine{
    from{
        transform:translateX(-220%) skewX(-20deg);
    }
    to{
        transform:translateX(900%) skewX(-20deg);
    }
}

.hero p{
    color:var(--muted);
    font-size:16px;
}

/* ===== SERVICES ===== */
.services{
    width:100%;
    max-width:1300px;
    margin:auto;
    padding:40px 20px 80px;
}

.services-title{
    text-align:center;
    font-size:34px;
    margin-bottom:50px;
    color:#fff;
    font-weight:800;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:24px;
}

.service-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:34px 26px;
    backdrop-filter:blur(8px);
    transition:.2s ease;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
}

.service-card:hover{
    transform:translateY(-8px);
    border-color:rgba(59,130,246,.5);
}

.service-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.04),transparent);
    transform:translateX(-100%);
    transition:.7s ease;
}

.service-card:hover::before{
    transform:translateX(100%);
}

.service-icon{
    font-size:40px;
    margin-bottom:22px;
    color:var(--gold);
}

.service-card h3{
    margin-bottom:12px;
    font-size:22px;
    color:#fff;
}

.service-card p{
    color:var(--muted);
    line-height:1.6;
    min-height:52px;
}

/* ===== BUTTONS ===== */
.btn,
.btn-valentine{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:20px;
    width:100%;
    min-height:50px;
    border-radius:14px;
    text-decoration:none;
    font-weight:700;
    transition:.3s ease;
    border:1px solid transparent;
}

.btn{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:#fff;
}

.btn-valentine{
    background:linear-gradient(135deg,#ec4899,#db2777);
    color:#fff;
}

.btn:hover,
.btn-valentine:hover{
    transform:translateY(-3px);
    filter:brightness(1.05);
}

/* ===== CONTACT ===== */
.contact{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
    padding:10px 20px 70px;
}

.contact a{
    width:60px;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    color:#fff;
    text-decoration:none;
    font-size:20px;
    transition:.3s ease;
    backdrop-filter:blur(10px);
}

.contact a:hover{
    transform:translateY(-5px);
    background:rgba(59,130,246,.2);
    border-color:rgba(59,130,246,.4);
}

/* ===== FOOTER ===== */
.footer{
    text-align:center;
    padding:0 20px 40px;
    color:var(--muted);
    font-size:14px;
}

/* ===== PETALS ===== */
@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){

    .top-bar{
        padding-top:18px;
    }

    .glass{
        width:100%;
        max-width:320px;
        text-align:center;
        font-size:14px;
    }

    .hero{
        min-height:48vh;
        padding-top:30px;
    }

    .hero p{
        font-size:15px;
    }

    .services{
        padding:20px 16px 60px;
    }

    .services-title{
        font-size:28px;
        margin-bottom:34px;
    }

    .service-card{
        padding:28px 22px;
        border-radius:20px;
    }

    .service-card h3{
        font-size:20px;
    }

    .btn,
    .btn-valentine{
        min-height:52px;
        font-size:15px;
    }

    .contact{
        gap:14px;
    }

    .contact a{
        width:56px;
        height:56px;
    }
}
</style>
</head>
<body>

<div id="loader">
    <span>👑</span>
    Cảm Ơn Vì Đã Tin Tưởng!
</div>

<div class="top-bar">
    <div class="name-wrapper glass" id="nameWrapper">
        👑 TTRIEU • MEOMEO 🐱
        <div class="horse-run" id="horse">💀</div>
    </div>
</div>

<section class="hero">
    <h1 id="heroTitle">Le Tran Tan Trieu ✓</h1>
    <p>2008</p>
</section>

<section class="services">
    <h2 class="services-title">Tiện ích:</h2>

    <div class="services-grid">

        <div class="service-card">
            <i class="fa-solid fa-heart service-icon"></i>
            <h3>Valentine</h3>
            <p>Mở trang Valentine.</p>
            <a href="/hoa" class="btn-valentine">Đi tới</a>
        </div>

        <div class="service-card">
            <i class="fa-solid fa-calculator service-icon"></i>
            <h3>Tính điểm</h3>
            <p>Công cụ tính điểm tốt nghiệp.</p>
            <a href="/diem" class="btn">Đi tới</a>
        </div>

        <div class="service-card">
            <i class="fa-solid fa-laptop-code service-icon"></i>
            <h3>22</h3>
            <p>Coming Soon...</p>
        </div>

        <div class="service-card">
            <i class="fa-solid fa-bolt service-icon"></i>
            <h3>06</h3>
            <p>Coming Soon...</p>
        </div>

    </div>
</section>

<section class="contact">

    <a href="https://www.facebook.com/share/1SfE8dUVnu/" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-facebook"></i>
    </a>

    <a href="#">
        <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="#">
        <i class="fa-brands fa-github"></i>
    </a>

    <a href="#">
        <i class="fa-solid fa-envelope"></i>
    </a>

</section>

<footer class="footer">
    © 2026 TTRIEU aka meomeo.
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const nameWrapper = document.getElementById("nameWrapper");

    /* ===== SHRINK EFFECT ===== */
    window.addEventListener("scroll", () => {
        const shrink = window.scrollY > 30;
        nameWrapper.classList.toggle("shrink", shrink);
    });

    /* ===== LIGHT PETAL EFFECT ===== */
    function createPetal(){

        // tắt hoàn toàn trên mobile để tối ưu FPS
        if(window.innerWidth < 768) return;

        // giới hạn số lượng effect
        if(document.querySelectorAll('.petal-effect').length > 4) return;

        const petal = document.createElement("div");
        petal.classList.add('petal-effect');

        petal.textContent = "🌸";
        petal.style.position = "fixed";
        petal.style.top = "-20px";
        petal.style.left = Math.random() * window.innerWidth + "px";
        petal.style.fontSize = (Math.random() * 10 + 14) + "px";
        petal.style.animation = `fall ${Math.random() * 4 + 6}s linear forwards`;
        petal.style.pointerEvents = "none";
        petal.style.opacity = ".8";
        petal.style.zIndex = "0";

        document.body.appendChild(petal);

        setTimeout(() => {
            petal.remove();
        }, 10000);
    }

    // giảm hiệu ứng gây lag

    if(window.innerWidth > 768){
        setInterval(createPetal, 5000);
    }

});
</script>

</body>
</html>
